quarkus.application.name=robinllm

# SQLite configuration for manual connection
sqlite.url=jdbc:sqlite:robinllm.db

scraper.enabled=true
scraper.interval=1h
scraper.openrouter.url=https://openrouter.ai/models
scraper.filter=free

metrics.enabled=false
metrics.interval=1h
metrics.test.prompts=What is 2+2?,Explain photosynthesis
metrics.top-models=3

router.weight.latency=0.6
router.weight.success=0.3
router.weight.rate-limit=0.1
router.circuit-breaker.threshold=0.5
router.retry.max=3
router.retry.backoff=1000

quarkus.http.port=8080
api.compatibility=openai
api.max-tokens=4096
api.timeout=30000

openrouter.api-key=${OPENROUTER_API_KEY:test-key-for-testing}
openrouter.base-url=https://openrouter.ai/api/v1

quarkus.log.category."com.robinllm".level=INFO
quarkus.log.category."com.robinllm.client".level=DEBUG
quarkus.log.level=INFO

